name: Java CI with Maven

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  checkstyle:
    name: 代码风格检查 (Checkstyle)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 运行 Checkstyle 检查
        run: mvn checkstyle:check

  build-and-test:
    name: 编译与测试
    runs-on: ubuntu-latest
    needs: checkstyle
    strategy:
      matrix:
        java-version: ['21', '22', '23']
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: 编译并运行测试
        run: mvn -B test --no-transfer-progress

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-jdk-${{ matrix.java-version }}
          path: target/surefire-reports/

  package:
    name: 打包 JAR
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 构建可执行 JAR
        run: mvn -B package -DskipTests --no-transfer-progress

      - name: 验证 JAR 可运行
        run: java -jar target/my-app-1.0-SNAPSHOT.jar

      - name: 上传 JAR 制品
        uses: actions/upload-artifact@v4
        with:
          name: my-app-jar
          path: target/*.jar

  notify:
    name: 构建状态汇总
    runs-on: ubuntu-latest
    needs: [checkstyle, build-and-test, package]
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - name: 输出构建摘要
        run: |
          echo "========================================"
          echo "   构建流水线执行完毕"
          echo "========================================"
          echo "提交者: ${{ github.actor }}"
          echo "分支:   ${{ github.ref_name }}"
          echo "SHA:    ${{ github.sha }}"
          echo "仓库:   ${{ github.repository }}"
